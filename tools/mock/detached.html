<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Overleaf (PDF)</title>
<!-- (Overleaf's "Open PDF in separate tab" (/project/<id>/detached): its PDF pane alone, with SyncTeX's ← to the code; the editor tab, told by mock:detached, lays out without its pane) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
<style>
  .material-symbols { font-family: "Material Symbols Rounded"; font-size: 20px; line-height: 1; font-feature-settings: "liga"; -webkit-font-smoothing: antialiased; }
  .toolbar-pdf .btn-link, .toolbar-pdf .btn-link:hover { color: #fff; text-decoration: none; }
  .toolbar-pdf .pdf-toolbar-btn { padding: 4px 6px; }
  .toolbar-pdf-right { display: flex; align-items: center; justify-content: flex-end; min-width: 0; }
  body { margin: 0; font: 14px system-ui, sans-serif; height: 100vh; display: flex; }
  .pdf { position: relative; flex: 1; display: flex; flex-direction: column; background: #3c4b5c; min-width: 0; }
  .toolbar-pdf { display: flex; justify-content: space-between; align-items: center; height: 40px; padding: 0 6px; background: #1b222c; color: #fff; }
  .toolbar-pdf-left { display: flex; align-items: center; gap: 6px; }
  .compile-button-group button { background: #138a07; color: #fff; border: 0; border-radius: 9999px; padding: 4px 12px; font-weight: 600; }
  .pdf-viewer { flex: 1; display: grid; place-items: center; color: #c9d1d9; font-size: 13px; }
  .synctex-controls { position: absolute; left: 4px; top: 50%; z-index: 12; }
  .synctex-control { border: 0; border-radius: 4px; background: #1b222c; color: #fff; padding: 2px; }
</style>
</head>
<body>
<div class="pdf full-size">
  <div class="toolbar-pdf"><div class="toolbar-pdf-left"><div class="compile-button-group"><button type="button" title="Recompile">Recompile</button></div></div><div class="toolbar-pdf-right"></div></div>
  <div class="synctex-controls"><button type="button" class="synctex-control" id="mock-to-code" aria-label="Go to code location"><span class="synctex-control-icon material-symbols">arrow_left_alt</span></button></div>
  <div class="pdf-viewer">Overleaf's PDF (detached)</div>
</div>
<script>
// (the editor tab lays out as Overleaf's does with its PDF detached: no PDF pane, SyncTeX's → beside the editor)
localStorage.setItem("mock:detached", "1");
addEventListener("pagehide", () => localStorage.removeItem("mock:detached"));
</script>
</body>
</html>
