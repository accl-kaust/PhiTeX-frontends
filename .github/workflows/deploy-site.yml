# phitex.org (apps/site/, merged from the PhiTeX.org repository): the static site
# built and deployed to Cloudflare Pages project phitex-org on each push to
# main that changes apps/site/, and each day (news.json follows PhiTeX's
# CHANGELOG.md on its main, and the measured page PhiTeX's latest release's
# bench.json: a release is seen within a day; run the workflow by hand, or
# PhiTeX's bench.yml sends bench-updated, to publish one at once). The demo (deploy-demo.yml) is deployed
# apart, on the rest.
#
# Secret: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit), the demo's. The
# VITE_* repository variables are optional: apps/site/src/links.ts has defaults.
name: deploy-site
on:
  push:
    branches: [main]
    paths: ["apps/site/**", "phitex", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:
  # (PhiTeX's bench.yml, a release measured: its bench.json shown at once; else the daily run below picks it up)
  repository_dispatch:
    types: [bench-updated]
  schedule:
    - cron: "17 3 * * *"
concurrency:
  group: deploy-site
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v7
      # (the Overleaf page bundles the viewer's loading animations from it: src/whatsnew.ts)
      - name: PhiTeX (the submodule; the viewer's sources are its; public, over HTTPS)
        working-directory: .
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: submodule update --init --depth 1 phitex
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm test
      # (news.json from PhiTeX's CHANGELOG.md on main, served at /news.json)
      - run: node scripts/news.mjs https://raw.githubusercontent.com/accl-kaust/PhiTeX/main/CHANGELOG.md public/news.json
      # (Windows: install.ps1 from PhiTeX at the frontends' pin, served beside
      # install.sh; the install page's Windows tab shown once PhiTeX's latest
      # release carries the Windows build. Until both, neither is served)
      - name: Windows installer
        run: |
          pin=$(git rev-parse HEAD:phitex)
          if curl -fsSL "https://raw.githubusercontent.com/accl-kaust/PhiTeX/$pin/scripts/install.ps1" -o public/install.ps1 \
            && curl -fsSL https://api.github.com/repos/accl-kaust/PhiTeX/releases/latest | grep -q '"name": *"phitex-x86_64-windows.zip"'; then
            echo "VITE_WINDOWS=1" >> "$GITHUB_ENV"
          else
            rm -f public/install.ps1
            echo "No Windows build in the latest release (or no install.ps1 at PhiTeX $pin): the page keeps 'Windows: not yet'."
          fi
      # (the measured page's numbers: the latest PhiTeX release's bench.json, which its
      # bench.yml attaches; the committed copy stays when a release has none or it is not JSON)
      - name: bench.json from PhiTeX's latest release
        run: |
          if curl -fsSL https://github.com/accl-kaust/PhiTeX/releases/latest/download/bench.json -o /tmp/bench.json \
            && node -e 'const b = JSON.parse(require("fs").readFileSync("/tmp/bench.json", "utf8")); if (!b.commit || !Array.isArray(b.corpora)) process.exit(1)'; then
            mv /tmp/bench.json public/bench.json
            echo "bench.json: PhiTeX $(node -p 'const b = require("./public/bench.json"); [b.release, b.commit.slice(0, 9), b.date].filter(Boolean).join(" ")')"
          else
            echo "No bench.json on PhiTeX's latest release: the committed one is served."
          fi
      - run: npm run build
        env:
          VITE_REPO_URL: ${{ vars.VITE_REPO_URL }}
          VITE_EXT_URL: ${{ vars.VITE_EXT_URL }}
          VITE_CHROME_URL: ${{ vars.VITE_CHROME_URL }}
          VITE_EDGE_URL: ${{ vars.VITE_EDGE_URL }}
          VITE_FIREFOX_URL: ${{ vars.VITE_FIREFOX_URL }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2925ae0c4cb07a33b3ab848a3a4c6c99
          workingDirectory: apps/site
          command: pages deploy dist --project-name=phitex-org --branch=main
