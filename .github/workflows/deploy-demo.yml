# demo.phitex.org on each push to main: the whole web frontend built from
# this commit, the wasm core with it (scripts/build/build.sh: PhiTeX's pinned
# commit, the phitex submodule, to wasm; the formats made by that core), then
# scripts/build/build-web.sh, deployed to Cloudflare Pages project phitex-demo.
#
# Secret: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit). (site/ is phitex.org,
# deploy-site.yml: a push that changes only it deploys only it)
name: deploy-demo
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:
concurrency:
  group: deploy-demo
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: PhiTeX (the submodule; the viewer's sources are its; public, over HTTPS)
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: submodule update --init --depth 1 phitex
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # (the toolchain rust-toolchain.toml pins, its wasm targets with it)
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> ../target/core
            diff-wasm -> target
      # (minted's wheels, the versions TeX Live ships, which build.sh takes from it locally)
      - run: |
          pip download --no-deps --only-binary=:all: -d target/minted latexminted==0.7.1 latexrestricted==0.6.2 latex2pydata==0.5.0 pygments==2.19.1
      - name: Build
        run: |
          MINTED_WHEELS=target/minted scripts/build/build.sh
          scripts/build/build-web.sh
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2925ae0c4cb07a33b3ab848a3a4c6c99
          command: pages deploy build/web --project-name=phitex-demo --branch=main
