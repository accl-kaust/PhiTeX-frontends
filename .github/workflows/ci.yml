# Each push and pull request: both extensions' TypeScript checked, and the
# unit tests (test/*.test.ts), the format lock among them
# (test/formats.test.ts: a stored shape changed without a new format fails).
# The engine (wasm) is built elsewhere: scripts/build/build.sh, on a build machine.
name: ci
# (site/ is checked by its deploy, deploy-site.yml)
on:
  push:
    paths-ignore: ["site/**", ".github/workflows/deploy-site.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/deploy-site.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PhiTeX (the submodule; the viewer's sources are its; public, over HTTPS)
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: submodule update --init --depth 1 phitex
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix vscode
      - name: TypeScript
        run: |
          npx tsc --noEmit -p overleaf
          npx tsc --noEmit -p vscode
      - name: Unit tests
        run: node --test test/*.test.ts
