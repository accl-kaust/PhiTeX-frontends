[package]
name = "phitex-overleaf-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# (PDF streams: a pure-Rust zlib for Host::deflate, which works in wasm; not
# zlib's bytes, so not byte-exact with pdfTeX, which a preview doesn't need)
miniz_oxide = "0.8"
phitex-core = { package = "partex-core", path = "../../../tmp/phitex-0cf6457/crates/partex-core" }
# (pdftext: the glyphs a PDF page shows, in the order origins count them)
phitex-engine = { package = "partex-engine", path = "../../../tmp/phitex-0cf6457/crates/partex-engine" }
# (BibTeX between a build's trips, in process: bib.rs)
phitex-bibtex = { package = "partex-bibtex", path = "../../../tmp/phitex-0cf6457/crates/partex-bibtex" }
# (XeTeX: its PDF from the XDV, in process; the glyph runs' outlines)
phitex-xdvipdfmx = { package = "partex-xdvipdfmx", path = "../../../tmp/phitex-0cf6457/crates/partex-xdvipdfmx" }
# (the page drawer: a PDF page's draw list, XeTeX's glyph runs, images)
phitex-draw = { path = "../../../tmp/phitex-0cf6457/crates/phitex-draw" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
