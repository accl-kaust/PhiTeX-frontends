[package]
name = "phitex-frontends-core"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false
description = "The engine for the frontends (Overleaf, VS Code builtin): PhiTeX's live document (phitex-live: the session, the viewer's protocol, the editor's buffers) as a WASI reactor on wasm32-wasip1-threads, its threads the host's workers on shared memory, its files (Shelf), store and outputs the host's through one thread that never blocks"

[[bin]]
name = "core"
path = "src/main.rs"

[dependencies]
phitex-tex = { path = "../phitex/crates/engines/tex" }
phitex-live = { path = "../phitex/crates/editor/live" }
phitex-shelf = { path = "../phitex/crates/tools/shelf" }
serde_json = "1"
# (only for `observe`: its checks switched on)
phitex-defuse = { path = "../phitex/crates/core/defuse", optional = true }

[features]
# PhiTeX's checks that a collected value is never read again (a panic
# naming it and its reader, where a release build reads freed memory)
observe = ["dep:phitex-defuse", "phitex-defuse/observe"]
# PhiTeX's probes compiled in, switched on by the environment
# (PHITEX_TEX_TIME=1, PHITEX_OBS=1: core.ts's `env`)
profile = ["phitex-tex/profile"]

# (thin LTO and parallel codegen: the engine's release speed without fat
# LTO's long link, as PhiTeX's fastdev; this machine is shared)
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = false
panic = "abort"
